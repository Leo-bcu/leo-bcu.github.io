<footer class="footer border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i><span data-zh="最后更新：">Last updated: </span><span class="lang-en">{{ "now" | date: "%b %Y" }}</span><span class="lang-zh">{{ "now" | date: "%Y 年 %-m 月" }}</span></i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    <span class="lang-en">{{ site.data.display.footer_text }}</span>
                    <span class="lang-zh">{{ site.data.display.footer_text_zh | default: site.data.display.footer_text }}</span>
                </div>
            </div>
        </div>
    </div>
</footer>
